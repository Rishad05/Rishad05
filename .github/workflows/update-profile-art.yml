name: Update Profile Art

on:
  schedule:
    - cron: "17 6 * * *"        # 06:17 UTC every day
  workflow_dispatch:            # manual trigger from the Actions tab

permissions:
  contents: write

concurrency:
  group: profile-art
  cancel-in-progress: false

env:
  GITHUB_USER: Rishad05

jobs:
  update-art:
    name: Refresh contributions → heatmap SVG
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scripts/requirements-ci.txt

      - name: Install CI dependencies (lightweight)
        run: |
          python -m pip install --upgrade pip
          pip install -r scripts/requirements-ci.txt

      - name: Scrape public contribution calendar
        run: python scripts/fetch_contributions.py "$GITHUB_USER"

      - name: Render contribution heatmap SVG
        run: python scripts/render_heatmap_svg.py

      - name: Commit updated art & data
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add contrib-heatmap.svg data/contributions.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "chore: auto-refresh contribution heatmap [skip ci]"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi